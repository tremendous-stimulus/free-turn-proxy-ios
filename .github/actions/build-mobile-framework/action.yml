name: Build mobile framework + cache
description: >
  Собирает Frameworks/Mobile.xcframework через Go+gomobile — апстрим (mobile) и наш
  WG-in-WG модуль (golib/ftun) ОДНИМ gomobile bind в один xcframework (раздельная
  сборка зашивает каждому пакету свой Go-рантайм и падает при совместном исполнении,
  см. план vpn-lexical-rossum.md, «Фаза 1.5 — блокер»). Кеш по hash(Makefile, golib/**) —
  правки в ftun тоже инвалидируют кеш. На cache hit три внутренних шага пропускаются.
  На cache miss ставит Go+gomobile, собирает фреймворк и сохраняет в кеш сразу после
  сборки — даже если последующие шаги job упадут.

runs:
  using: composite
  steps:
    - name: Restore cache
      id: cache-fw
      uses: actions/cache/restore@v4
      with:
        path: Frameworks/Mobile.xcframework
        key: mobile-xcframework-${{ hashFiles('Makefile', 'golib/**') }}

    - name: Set up Go
      if: steps.cache-fw.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: false

    - name: Build framework
      if: steps.cache-fw.outputs.cache-hit != 'true'
      shell: bash
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH="$(go env GOPATH)/bin:$PATH"
        make framework

    # if: always() — сохраняем фреймворк сразу после сборки, чтобы падение
    # тестов/релиза ниже по job не сожрало 5-7 минут пересбора в следующий ран.
    - name: Save cache
      if: always() && steps.cache-fw.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: Frameworks/Mobile.xcframework
        key: mobile-xcframework-${{ hashFiles('Makefile', 'golib/**') }}
